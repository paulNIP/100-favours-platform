[project]
name = "notification-service"
version = "0.1.0"
description = "Telegram notifications: plain messages and named templates."
requires-python = ">=3.12"
dependencies = [
    "platform-common",
    "uvicorn[standard]==0.32.*",
    "httpx==0.27.*",
]

[tool.uv.sources]
platform-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
