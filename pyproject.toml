[project]
name = "favours-platform"
version = "0.1.0"
description = "FastAPI microservices monorepo: gateway, odds, notifications, predictions."
requires-python = ">=3.12"

[tool.uv]
package = false  # the root is only the workspace; the services are the packages

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
platform-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905"]  # FastAPI Depends()/Query() defaults; zip(strict=) noise
